services:
  - type: web
    name: campus-gate-chain
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix backend && npm ci --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CHAIN_ID
        value: "84532"
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: PUBLIC_RPC_URL
        value: https://sepolia.base.org
      - key: CONTRACT_ADDRESS
        sync: false
      - key: PLATE_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: GUARD_USER
        sync: false
      - key: GUARD_PASS
        sync: false
